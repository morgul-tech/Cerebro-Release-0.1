schema: cerebro-release/v0.1
source_authority:
  identity: Cerebro Source 1.0
  authority: sole
  declaration: standards/source-authority.yaml
  source_folder_required: false
  implementation_authoritative: false
release:
  name: Cerebro
  version: 0.1.0
  status: release-candidate
runtime:
  schema: schemas/runtime.schema.yaml
  lifecycle: runtime/lifecycle.yaml
  activation: runtime/activation.yaml
  errors: runtime/error-codes.yaml
core:
  principles: core/principles.yaml
  terminology: core/terminology.yaml
  priorities: core/priorities.yaml
standards:
  manifest: standards/standards.yaml
  schema: schemas/standard-document.schema.yaml
  validator: tooling/standards/validate_standards.py
validation:
  common_entrypoint: valider
  command: python cerebro_tool.py valider
  deterministic: true
  pure_state_transformations: true
  max_stabilization_cycles: 8
engines:
- id: dialog
  path: engines/dialog/
  required: true
- id: context
  path: engines/context/
  required: true
- id: collaboration
  path: engines/collaboration/
  required: true
- id: project-lite
  path: engines/project-lite/
  required: false
- id: quality-lite
  path: engines/quality-lite/
  required: true
- id: presentation-lite
  path: engines/presentation-lite/
  required: true
