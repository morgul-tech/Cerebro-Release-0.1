$schema: https://json-schema.org/draft/2020-12/schema
$id: cerebro-standard-document/v0.1
title: Cerebro Standard Document
type: object
additionalProperties: false
required:
- schema
- standard
- rules
properties:
  schema:
    const: cerebro-standard/v0.1
  standard:
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - version
    - status
    - authority
    - scope
    - consumers
    properties:
      id:
        type: string
        pattern: ^STD-[A-Z0-9-]+$
      name:
        type: string
        minLength: 1
      version:
        type: string
        pattern: ^0\.1\.[0-9]+$
      status:
        enum:
        - draft
        - approved
        - deprecated
      authority:
        const: authoritative
      scope:
        type: string
        minLength: 1
      consumers:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
  rules:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - statement
      - priority
      - verification
      properties:
        id:
          type: string
          pattern: ^STD-[A-Z0-9-]+-R[0-9]{3}$
        statement:
          type: string
          minLength: 1
        priority:
          enum:
          - critical
          - high
          - normal
          - low
        verification:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
