$schema: https://json-schema.org/draft/2020-12/schema
$id: cerebro-patch-manifest/v0.1
type: object
additionalProperties: false
required:
- schema
- patch
- files
- verification
- publication
properties:
  schema:
    const: cerebro-patch-manifest/v0.1
  patch:
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - target
    - prerequisite
    properties:
      id:
        type: string
        pattern: ^[0-9]{4}[A-Z]?$
      name:
        type: string
      target:
        type: string
      prerequisite:
        type: array
        items:
          type: string
      includes:
        type: array
        items:
          type: string
  files:
    type: array
  verification:
    type: array
  publication:
    type: object
    additionalProperties: false
    required:
    - enabled
    - require_pipeline_pass
    - pipeline
    - remote
    - branch
    - commit_message
    - generated_paths
    - repository_url
    properties:
      enabled:
        const: true
      require_pipeline_pass:
        const: true
      pipeline:
        type: array
        minItems: 1
        items:
          type: string
      remote:
        type: string
      branch:
        type: string
        minLength: 1
      commit_message:
        type: string
      generated_paths:
        type: array
        items:
          type: string
      repository_url:
        type: string
        pattern: ^https://github\.com/.+\.git$
