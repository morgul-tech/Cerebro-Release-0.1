$schema: https://json-schema.org/draft/2020-12/schema
$id: cerebro-patch-manifest/v1.0
type: object
additionalProperties: false
required: [schema, patch, authoritative, baseline, files, verification, publication]
properties:
  schema:
    const: cerebro-patch-manifest/v1.0
  patch:
    type: object
    additionalProperties: false
    required: [id, name, target, prerequisite]
    properties:
      id:
        type: string
        pattern: '^[0-9]{4}[A-Z]?$'
      name: {type: string, minLength: 1}
      target: {type: string, minLength: 1}
      prerequisite:
        type: array
        items: {type: string, minLength: 1}
      includes:
        type: array
        items: {type: string, minLength: 1}
  authoritative:
    type: object
    additionalProperties: false
    required: [repository_url, branch, commit]
    properties:
      repository_url:
        type: string
        pattern: ^https://github\.com/.+\.git$
      branch: {type: string, minLength: 1}
      commit: {type: string, pattern: '^[0-9a-fA-F]{40}$'}
  baseline:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [destination, state]
      properties:
        destination: {$ref: '#/$defs/destination'}
        state: {enum: [present, absent]}
        sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
      allOf:
      - if:
          properties: {state: {const: present}}
        then:
          required: [sha256]
      - if:
          properties: {state: {const: absent}}
        then:
          not: {required: [sha256]}
  files:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [source, destination, operation, sha256]
      properties:
        source: {$ref: '#/$defs/safeRelativePath'}
        destination: {$ref: '#/$defs/destination'}
        operation: {enum: [create, replace, delete]}
        sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
  verification:
    type: array
    items:
      type: array
      minItems: 1
      maxItems: 16
      items:
        type: string
        minLength: 1
        maxLength: 260
        pattern: '^(?!.*(?:&&|\|\||[|<>`]|\$\(|%[^%]+%|\.\.[/\\])).+$'
  publication:
    type: object
    additionalProperties: false
    required: [enabled, require_pipeline_pass, pipeline, remote, branch, commit_message, generated_paths, repository_url]
    properties:
      enabled: {type: boolean}
      require_pipeline_pass: {const: true}
      pipeline:
        type: array
        minItems: 1
        maxItems: 16
        items:
          type: string
          minLength: 1
          maxLength: 260
          pattern: '^(?!.*(?:&&|\|\||[|<>`]|\$\(|%[^%]+%|\.\.[/\\])).+$'
      remote: {type: string, pattern: '^[A-Za-z0-9._-]+$'}
      branch: {type: string, minLength: 1}
      commit_message: {type: string, minLength: 1}
      generated_paths:
        type: array
        items: {$ref: '#/$defs/safeRelativePath'}
      repository_url:
        type: string
        pattern: ^https://github\.com/.+\.git$
$defs:
  safeRelativePath:
    type: string
    minLength: 1
    pattern: '^(?![A-Za-z]:)(?![/\\])(?!.*(?:^|[/\\])\.\.(?:[/\\]|$))(?!.*:)(?!.*[/\\]$).+$'
  destination:
    type: string
    pattern: '^\{(?:REPOSITORY_ROOT|SCRIPTS_ROOT)\}/(?!.*(?:^|/)\.\.(?:/|$))(?!.*:)(?!/).+$'
