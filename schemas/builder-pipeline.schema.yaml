$schema: https://json-schema.org/draft/2020-12/schema
$id: cerebro-builder-pipeline/v0.1
type: object
additionalProperties: false
required:
- schema
- pipeline
- stages
properties:
  schema:
    const: cerebro-builder-pipeline/v0.1
  pipeline:
    type: object
    additionalProperties: false
    required:
    - id
    - version
    - fail_fast
    - report
    properties:
      id:
        type: string
        minLength: 1
      version:
        type: string
        minLength: 1
      fail_fast:
        type: boolean
      report:
        type: string
        minLength: 1
  stages:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - script
      - required
      properties:
        id:
          type: string
          pattern: ^BP-[0-9]{3}$
        name:
          type: string
          minLength: 1
        script:
          type: string
          minLength: 1
        arguments:
          type: array
          items:
            type: string
        required:
          type: boolean
        enabled:
          type: boolean
