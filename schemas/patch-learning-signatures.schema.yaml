$schema: https://json-schema.org/draft/2020-12/schema
$id: cerebro-plc-signatures/v1
type: object
additionalProperties: false
required: [schema, signatures]
properties:
  schema: {const: cerebro-plc-signatures/v1}
  signatures:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, lifecycle, classification, autonomy_level, outcome, verification_profile]
      properties:
        id: {type: string, pattern: '^PLC-[A-Z0-9-]+-[0-9]{3}$'}
        lifecycle: {enum: [observed, proposed, qualified, active, suspended, superseded]}
        classification: {type: string, minLength: 1}
        match_any: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        match_all: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        autonomy_level: {enum: [A, B, C, D]}
        outcome: {enum: [CONTINUE, REMEDIATE_AND_CONTINUE, RETRY, USER_DECISION_REQUIRED, SAFETY_BLOCK]}
        verification_profile: {enum: [focused, standard, full]}
      anyOf:
      - required: [match_any]
      - required: [match_all]

