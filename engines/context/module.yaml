schema: cerebro-module-contract/v0.1
module:
  id: context
  version: 0.1.0
  type: engine
  responsibility: Maintain explicit context, authority, and valid context transitions.
  deterministic: true
  idempotent_activation: true
accepts:
  runtime_schema: cerebro-runtime/v0.1
  required_fields: [context.items]
produces:
  mutations: [context.items]
  events: [context_item_added, context_item_updated, decision_registered, current_basis_updated]
  errors: [E003, E007, E010]
permissions:
  read: [task, dialog, context]
  write: [context.items]
  forbidden: [dialog, project, quality, presentation]
activation:
  mode: always
  conditions: []
  priority: critical
failure_behavior:
  on_invalid_input: reject
  on_internal_failure: fail_runtime
  rollback: atomic
