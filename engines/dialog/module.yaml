schema: cerebro-module-contract/v0.1
module:
  id: dialog
  version: 0.1.0
  type: engine
  responsibility: Select work mode, dialog state, and active modules.
  deterministic: true
  idempotent_activation: true
accepts:
  runtime_schema: cerebro-runtime/v0.1
  required_fields: [task.input]
produces:
  mutations: [dialog.work_mode, dialog.state, dialog.active_modules, dialog.clarification_required, dialog.control_stop]
  events: [work_mode_selected, dialog_state_changed, module_activated, control_stop_created]
  errors: [E001, E004, E005]
permissions:
  read: [task, context, quality]
  write: [dialog]
  forbidden: [context.items, quality, project]
activation:
  mode: always
  conditions: []
  priority: critical
failure_behavior:
  on_invalid_input: control_stop
  on_internal_failure: fail_runtime
  rollback: atomic
