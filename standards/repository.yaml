schema: cerebro-standard/v0.1
standard:
  id: STD-REPO
  name: Repository Structure Standard
  version: 0.1.1
  status: approved
  authority: authoritative
  scope: Authoritative placement, required components, and preflight integrity of
    Cerebro Release 0.1.
  consumers:
  - manifest
  - builder
  - validator
  - maintainer
  - repository-checker
rules:
- id: STD-REPO-R001
  statement: cerebro.yaml shall be the release entry manifest in the repository root.
  priority: critical
  verification:
  - cerebro.yaml exists at repository root.
- id: STD-REPO-R002
  statement: The Builder shall perform repository integrity validation before dependency
    checks or other build steps.
  priority: critical
  verification:
  - Repository is the first builder step.
- id: STD-REPO-R003
  statement: Missing required tooling components shall produce explicit preflight
    failures before subprocess execution.
  priority: critical
  verification:
  - Builder lists each missing path and exits non-zero.
- id: STD-REPO-R004
  statement: Generated repository integrity reports shall be stored under validation/.
  priority: high
  verification:
  - repository-report.json and repository-report.txt are generated.
- id: STD-REPO-R005
  statement: External BAT launchers may reside outside the repository and shall resolve
    the repository entrypoint explicitly.
  priority: high
  verification:
  - Launchers verify cerebro_tool.py before execution.
