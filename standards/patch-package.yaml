schema: cerebro-standard/v0.1
standard:
  id: STD-PATCH
  name: Patch Package Standard
  version: 0.1.2
  status: approved
  authority: authoritative
  scope: Portable, self-installing, traceable, and verifiable Cerebro patch packages.
  consumers:
  - builder
  - packager
  - validator
  - maintainer
  - patch-installer
rules:
- id: STD-PATCH-R001
  statement: Every installable patch shall contain INSTALL_PATCH.bat, installer/patch_installer.py,
    and installer/locate_cerebro.py.
  priority: critical
  verification:
  - All three files exist in the patch package.
- id: STD-PATCH-R002
  statement: The installer shall support repository discovery and shall not require
    hardcoded command-line paths.
  priority: critical
  verification:
  - INSTALL_PATCH.bat invokes the installer without repository arguments.
  - The locator resolves or prompts for paths.
- id: STD-PATCH-R003
  statement: Resolved local paths shall be stored outside the repository as local
    user configuration.
  priority: high
  verification:
  - Settings are stored under LOCALAPPDATA/Cerebro/settings.json.
- id: STD-PATCH-R004
  statement: Manual path entry shall remain available when automatic discovery fails.
  priority: high
  verification:
  - Interactive prompt validates cerebro.yaml and cerebro_tool.py.
- id: STD-PATCH-R005
  statement: Source and destination checksums, backup, and post-install verification
    remain mandatory.
  priority: critical
  verification:
  - All payload hashes are checked before and after copying.
  - Replaced files are backed up.
  - Manifest verification commands run.
