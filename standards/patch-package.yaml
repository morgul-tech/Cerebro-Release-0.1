schema: cerebro-standard/v0.1
standard:
  id: STD-PATCH
  name: Patch Package Standard
  version: 0.1.3
  status: approved
  authority: authoritative
  scope: Automatically built, portable, self-installing, and validated Cerebro patch
    packages.
  consumers:
  - patch-builder
  - patch-validator
  - patch-installer
  - builder
  - maintainer
rules:
- id: STD-PATCH-R001
  statement: Every distributed patch shall be generated from declarative input.
  priority: critical
  verification:
  - Patch Builder generates the manifest and package files.
- id: STD-PATCH-R002
  statement: Every patch shall pass directory validation and packaged ZIP validation.
  priority: critical
  verification:
  - Both stages return PASS before distribution.
- id: STD-PATCH-R003
  statement: Every payload file shall be registered exactly once with a valid SHA-256
    digest.
  priority: critical
  verification:
  - No unregistered or missing payload files exist.
- id: STD-PATCH-R004
  statement: Patch documentation and installer entrypoints shall be generated consistently.
  priority: high
  verification:
  - Required root and installer files exist.
