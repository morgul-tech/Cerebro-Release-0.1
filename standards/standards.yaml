schema: cerebro-standards-manifest/v0.1
standards_engine:
  id: standards
  version: 0.1.0
  role: derived-policy-registry
  runtime_engine: false
  policy_owner: Cerebro Source 1.0
  implementation_owner: tooling
documents:
- id: STD-MCP
  path: standards/mcp.yaml
  required: true
- id: STD-SOURCE
  path: standards/source-authority.yaml
  required: true
- id: STD-PATCH
  path: standards/patch-package.yaml
  required: true
- id: STD-BAT
  path: standards/bat-launcher.yaml
  required: true
- id: STD-TOOL
  path: standards/tooling.yaml
  required: true
- id: STD-REPO
  path: standards/repository.yaml
  required: true
- id: STD-REPORT
  path: standards/report.yaml
  required: true
- id: STD-NAME
  path: standards/naming.yaml
  required: true
- id: STD-VALID
  path: standards/validation.yaml
  required: true
- id: STD-RELEASE
  path: standards/release.yaml
  required: true
- id: STD-BUILDER
  path: standards/builder-pipeline.yaml
  required: true
- id: STD-PUBLICATION
  path: standards/publication-gate.yaml
  required: true
- id: STD-QUALITY
  path: standards/quality-gate.yaml
  required: true
- id: STD-VALIDER
  path: standards/valider-command.yaml
  required: true
- id: STD-OPERATIONAL-PROGRESS
  path: standards/operational-progress.yaml
  required: true
governance:
  source_authority: Cerebro Source 1.0
  policy_over_implementation: true
  single_source_of_truth: true
  write_once_authority: true
  implementation_disposable: true
  quality_gate_required_for_publication: true
  common_validation_entrypoint: valider
  unregistered_standards_authoritative: false
  control_layer: MCP
  mcp_default_state: active
